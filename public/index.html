<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محلل يوتيوب الذكي</title>
    <style>
        :root {
            --primary: #ff0000;
            --dark: #212121;
            --gray: #606060;
            --light: #f9f9f9;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .app-card {
            background: white;
            width: 100%;
            max-width: 550px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow: hidden;
            padding: 25px;
        }

        .header h1 {
            color: var(--primary);
            text-align: center;
            margin-top: 0;
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 25px;
        }

        input {
            flex: 1;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus { border-color: var(--primary); }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        /* ستايل النتائج */
        #output { display: none; animation: fadeIn 0.5s; }

        .thumb-container { position: relative; border-radius: 12px; overflow: hidden; }
        .thumb-container img { width: 100%; display: block; }
        
        .download-btn {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 12px;
        }

        .video-info h2 { font-size: 1.2rem; margin: 15px 0; color: var(--dark); }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 15px 0;
        }

        .stat-card {
            background: var(--light);
            padding: 12px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-label { font-size: 12px; color: var(--gray); display: block; }
        .stat-value { font-weight: bold; color: var(--dark); font-size: 16px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="app-card">
    <div class="header">
        <h1>YouTube Pro</h1>
    </div>

    <div class="input-group">
        <input type="text" id="videoUrl" placeholder="أدخل رابط الفيديو هنا...">
        <button onclick="getVideoInfo()">تحليل</button>
    </div>

    <div id="output">
        </div>
</div>

<script>
// وظيفة لتحويل مدة يوتيوب ISO 8601 إلى تنسيق وقت مقروء
function parseDuration(duration) {
    const match = duration.match(/PT(\d+H)?(\d+M)?(\d+S)?/);
    const hours = (parseInt(match[1]) || 0);
    const minutes = (parseInt(match[2]) || 0);
    const seconds = (parseInt(match[3]) || 0);
    
    return [hours, minutes, seconds]
        .map(v => v < 10 ? "0" + v : v)
        .filter((v, i) => v !== "00" || i > 0)
        .join(":");
}

async function getVideoInfo() {
    const url = document.getElementById('videoUrl').value;
    const output = document.getElementById('output');
    if (!url) return;

    output.style.display = 'block';
    output.innerHTML = "<p style='text-align:center'>جاري التحليل...</p>";

    try {
        const res = await fetch(`/api/video-info?url=${encodeURIComponent(url)}`);
        const data = await res.json();

        if (data.items && data.items[0]) {
            const v = data.items[0];
            const thumbUrl = v.snippet.thumbnails.maxres ? v.snippet.thumbnails.maxres.url : v.snippet.thumbnails.high.url;
            
            output.innerHTML = `
                <div class="thumb-container">
                    <img src="${thumbUrl}">
                    <a href="${thumbUrl}" target="_blank" download class="download-btn">📥 تحميل الغلاف بجودة عالية</a>
                </div>
                
                <div class="video-info">
                    <h2>${v.snippet.title}</h2>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <span class="stat-label">عدد المشاهدات</span>
                        <span class="stat-value">${Number(v.statistics.viewCount).toLocaleString()}</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-label">مدة الفيديو</span>
                        <span class="stat-value">${parseDuration(v.contentDetails.duration)}</span>
                    </div>
                </div>

                <div class="stat-card" style="margin-top:0">
                    <span class="stat-label">عدد الإعجابات</span>
                    <span class="stat-value">👍 ${Number(v.statistics.likeCount).toLocaleString()}</span>
                </div>
            `;
        } else {
            output.innerHTML = "لم يتم العثور على الفيديو";
        }
    } catch (e) {
        output.innerHTML = "خطأ في جلب البيانات";
    }
}
</script>

</body>
</html>
